name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manager:
    name: manager (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: manager
    env:
      # A failed test copies its daemon's logs here (tests/common Home::drop).
      PI_FAMULUS_TEST_ARTIFACTS: ${{ github.workspace }}/pi-famulus-test-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: manager
      # Real time: the actual idle / kill graces (timing_canary included).
      - run: cargo test
      # Manual clock: the daemon's own timers are stepped by the tests.
      - run: cargo test --features test-clock
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: manager-logs-${{ matrix.os }}
          path: pi-famulus-test-artifacts
          if-no-files-found: ignore

  # No Windows job: the manager is unix-only, and the extension reaches it
  # over a unix socket path (manager/TESTING.md, Deferrals).
  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run

  # Real pi + real pi-famulus + the extension, driven by the faux model.
  # No model credentials, no network: pi runs with --offline.
  e2e:
    name: e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    env:
      PI_FAMULUS_MANAGER_PATH: ${{ github.workspace }}/manager/target/release/pi-famulus
      PI_BIN: ${{ github.workspace }}/eval/node_modules/.bin/pi
      # Keep every sandbox (/tmp/pi-famulus-eval-*) so a failure can be uploaded.
      PI_FAMULUS_EVAL_KEEP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: manager
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            extension/package-lock.json
            eval/package-lock.json
      - run: cargo build --release
        working-directory: manager
      # Require the exact release artifact before running real integration;
      # a missing or misnamed binary must not pass as green.
      - run: test -x "$PI_FAMULUS_MANAGER_PATH"
      - run: npm ci
        working-directory: extension
      - run: npm ci
        working-directory: eval
      - run: npx vitest run tests/integration/real-manager.test.ts
        working-directory: extension
        env:
          PI_FAMULUS_INTEG: "1"
      - run: npm run typecheck
        working-directory: eval
      - run: npm run test:unit
        working-directory: eval
      - run: npm run test:e2e
        working-directory: eval
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-sandboxes-${{ matrix.os }}
          path: |
            /tmp/pi-famulus-eval-*/h/manager.log
            /tmp/pi-famulus-eval-*/h/events.jsonl
            /tmp/pi-famulus-eval-*/h/config.json
            /tmp/pi-famulus-eval-*/faux-trace.jsonl
          if-no-files-found: ignore
