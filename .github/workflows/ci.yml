name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-upgrade:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: manager
    env:
      PBS_TEST_ARTIFACTS: ${{ github.workspace }}/pbs-test-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: manager
      - run: sw_vers; sysctl kern.ipc.maxpipekva kern.ipc.pipekva hw.ncpu 2>&1 || true
      - run: cargo test --test upgrade -- u1_ u5_ u11_ || true
      - run: cargo test --test upgrade -- u1_ u5_ u11_ || true
      - run: cargo test --test upgrade -- u1_ u5_ u11_
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-upgrade
          path: pbs-test-artifacts
          if-no-files-found: ignore
