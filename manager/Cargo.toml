[package]
name = "pbs-manager"
version = "0.1.0"
edition = "2021"
description = "Cross-platform process management daemon for pi-better-subagents"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
interprocess = { version = "2", features = ["tokio"] }
fd-lock = "4"
libc = "0.2"

[features]
# Test-only: the daemon's own timers (idle grace, SIGKILL escalation,
# re-adopt / leftover-group polls) can run on a manual clock, advanced with
# the `clock_advance` debug request, when the daemon starts with
# PBS_TEST_CLOCK=manual. Never enable in release builds.
test-clock = []

[profile.release]
lto = true
codegen-units = 1
strip = true
