[package]
name = "pbs-manager"
version = "0.1.0"
edition = "2021"
description = "Cross-platform process management daemon for pi-better-subagents"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
interprocess = { version = "2", features = ["tokio"] }
fd-lock = "4"
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
