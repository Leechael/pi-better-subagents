[package]
name = "pbs-manager"
version = "0.1.0"
edition = "2021"
description = "Cross-platform process management daemon for pi-better-subagents"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
interprocess = { version = "2", features = ["tokio"] }
fd-lock = "4"
libc = "0.2"

[features]
# Test-only: the daemon's own timers (idle grace, SIGKILL escalation,
# re-adopt / leftover-group polls) can run on a manual clock, advanced with
# the `clock_advance` debug request, when the daemon starts with
# PBS_TEST_CLOCK=manual. Never enable in release builds.
test-clock = []

# Thin LTO over the default codegen units: an incremental release build
# (the install step in docs/testing-guide.md) takes ~10 s instead of ~30 s
# with fat LTO on one unit, for a ~1 MB larger binary. The daemon is not
# CPU-bound, so the extra optimisation bought nothing measurable.
[profile.release]
lto = "thin"
strip = true
