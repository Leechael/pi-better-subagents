[[ablation]]
id = "clients-never-clean"
mechanism = "clients never delete socket/pid files. This entry is a regression check: it re-adds the removed client-side zombie cleanup"
file = "src/client.rs"
find = "        // Steps 2–4: spawn lock; winner spawns, losers wait for the socket."
replace = '''
        match lifecycle::read_pid_file(home) {
            Some(pf) if !task::pid_alive(pf.pid) => {
                let _ = lifecycle::cleanup_stale_files(home);
            }
            None => {
                let _ = std::fs::remove_file(lifecycle::socket_path(home));
            }
            _ => {}
        }'''
tests = ["lifecycle_adversarial::d2_concurrent_clients_over_stale_files_spawn_exactly_one_daemon"]
expect = "red"
note = "a race; red in 3/3 runs with the reproducer's CPU load"

[[ablation]]
id = "spawn-lock"
mechanism = "clients serialize daemon spawning through an fd-lock on manager.spawn.lock (§3.1 steps 2-4)"
file = "src/lifecycle.rs"
find = "    home.join(\"manager.spawn.lock\")"
replace = "    home.join(format!(\"manager.spawn.lock.{}\", std::process::id()))"
tests = [
  "lifecycle_adversarial::d1_concurrent_clients_spawn_exactly_one_daemon",
  "lifecycle_adversarial::d2_concurrent_clients_over_stale_files_spawn_exactly_one_daemon",
]
expect = "green"
note = "no longer load-bearing for correctness: the daemon lifetime lock alone guarantees one daemon, and extra spawns exit at once with 'already running'. The spawn lock only avoids starting redundant processes"

